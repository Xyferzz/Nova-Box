<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaBox - API Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b0f1d;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{

width:100%;
max-width:420px;

background:#14192b;

border:1px solid rgba(255,255,255,.06);

border-radius:20px;

padding:28px;

box-shadow:0 20px 50px rgba(0,0,0,.45);

}

.logo{

width:70px;
height:70px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#6d28d9,#4f46e5);

display:flex;
align-items:center;
justify-content:center;

font-size:32px;
font-weight:bold;
color:white;

margin-bottom:18px;

}

h1{

color:white;
text-align:center;

font-size:28px;

margin-bottom:8px;

}

.desc{

text-align:center;
color:#9ca3af;

margin-bottom:25px;

}

input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

background:#1d2338;

color:white;

margin-bottom:15px;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:linear-gradient(135deg,#6d28d9,#4f46e5);

color:white;

font-size:15px;

font-weight:600;

cursor:pointer;

margin-bottom:12px;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

}

#apiBox{

display:none;

margin-top:20px;

}

#apiKey{

background:#1d2338;

font-family:monospace;

}

.footer{

margin-top:20px;

text-align:center;

color:#777;

font-size:13px;

}

a{

color:#7c3aed;

text-decoration:none;

}

</style>

</head>
<body>

<div class="card">

<div class="logo">
N
</div>

<h1>Get API Key</h1>

<p class="desc">
Login menggunakan Magic Link untuk mendapatkan API Key NovaBox.
</p>

<div id="loginBox">

<input
type="email"
id="emailInput"
placeholder="Masukkan Email">

<button id="sendMagicLink">
Kirim Magic Link
</button>

</div>

<div id="apiBox">

<input
type="text"
id="apiKey"
readonly
placeholder="API Key akan muncul di sini">

<button id="copyApiKey">
Copy API Key
</button>

</div>

<div class="footer">

<a href="index.html">
← Kembali ke Upload
</a>

</div>

</div>

<script type="module" src="apikey.js"></script>

</body>
</html>
