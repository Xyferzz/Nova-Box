<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBox - Upload & Share</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="logo">
        N
    </div>

    <h1>NovaBox</h1>

    <p class="desc">
        Fast & Free Image / Video Hosting
    </p>

    <div class="upload-box" id="dropArea">

        <input
        type="file"
        id="fileInput"
        accept="image/*,video/*"
        hidden>

        <label for="fileInput">

            <div class="icon">
                📤
            </div>

            <h2>
                Upload File
            </h2>

            <span>
                Click or Drag & Drop
            </span>

        </label>

    </div>

    <div id="preview"></div>

    <button id="uploadBtn">
        Upload Now
    </button>

    <button
    id="getApiKeyBtn"
    onclick="location.href='apikey.html'">
    Get API Key
    </button>
    
    <div id="progressArea">

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <span id="progressText">
            0%
        </span>

    </div>

    <div id="result">

        <input
        type="text"
        id="urlResult"
        readonly
        placeholder="Upload result...">

        <button id="copyBtn">
            Copy URL
        </button>

    </div>

    <div class="footer">

        <div class="support">

            PNG • JPG • WEBP • GIF • MP4

        </div>

        <div class="copyright">

            © 2026 NovaBox

            <br>

            Powered by
            <b>@Xyferzz</b>

        </div>

    </div>

</div>

    <div id="loginPopup">

    <div class="popup-box">

        <h2>Get API Key</h2>

        <input
            type="email"
            id="emailInput"
            placeholder="Masukkan email">

        <button id="sendMagicLink">
            Kirim Magic Link
        </button>

        <button id="closePopup">
            Tutup
        </button>

    </div>

    </div>

    <div id="toast" class="toast"></div>

<script type="module" src="script.js"></script>


</body>
</html>
